<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- App tile background, matching the app's dark VSCode-style theme -->
  <rect width="64" height="64" rx="14" fill="#1e1e1e"/>

  <!-- Table card -->
  <rect x="8" y="9" width="48" height="46" rx="5" fill="#252526" stroke="#3c3c3c" stroke-width="2"/>

  <!-- Header row (accent color, echoes the app's #007acc accent) -->
  <path d="M8 14a5 5 0 0 1 5-5h38a5 5 0 0 1 5 5v8H8v-8Z" fill="#007acc"/>

  <!-- Column dividers -->
  <line x1="24" y1="9" x2="24" y2="55" stroke="#3c3c3c" stroke-width="2.5"/>
  <line x1="40" y1="9" x2="40" y2="55" stroke="#3c3c3c" stroke-width="2.5"/>

  <!-- Row dividers -->
  <line x1="8" y1="31" x2="56" y2="31" stroke="#3c3c3c" stroke-width="2.5"/>
  <line x1="8" y1="43" x2="56" y2="43" stroke="#3c3c3c" stroke-width="2.5"/>

  <!-- One highlighted cell, nodding to the TSV file-type color used in-app -->
  <rect x="25" y="32" width="14" height="10" fill="#7db8f5" fill-opacity="0.55"/>
</svg>
