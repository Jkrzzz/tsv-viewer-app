<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Table Viewer</title>
    <script type="module" crossorigin src="./assets/index-COFaO9Xu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bw-IAOd5.css">
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="folder-picker">
          <button id="open-folder-btn">📁 Open Folder…</button>
        </div>
        <div id="unsupported-browser-note" class="hidden">
          This app needs the File System Access API, currently supported in
          Chrome, Edge, and other Chromium browsers. Please open this page in
          one of those to browse local folders.
        </div>

        <div id="reconnect-banner" class="hidden"></div>

        <div id="recent-folders">
          <div id="recent-folders-header" class="section-header">
            <span class="section-arrow" id="recent-arrow">▸</span>
            <h3>Recent Folders</h3>
          </div>
          <ul id="recent-list" class="collapsed"></ul>
        </div>

        <div id="file-tree-wrap">
          <h3 id="current-folder-label">No folder open</h3>
          <ul id="file-tree"></ul>
        </div>
      </aside>

      <div id="sidebar-resizer" title="Drag to resize"></div>

      <main id="editor-area">
        <div id="tab-bar"></div>
        <div id="grid-container">
          <div id="empty-state">
            Open a folder, then click a .csv/.tsv file to view it here.
          </div>
        </div>
      </main>
    </div>

    <div id="context-menu" class="context-menu hidden"></div>

  </body>
</html>
